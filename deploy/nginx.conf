# ==============================================================================
# NGINX Configuration for IoT Humidity Monitor
# Server OS : CentOS / RHEL (IP: 192.168.40.193)
# Frontend  : Next.js (Port 3000)
# Backend   : Express API (Port 8091)
# ==============================================================================
# 
# Installation on CentOS:
# 1. sudo cp nginx.conf /etc/nginx/conf.d/iot-humidity.conf
# 2. sudo setsebool -P httpd_can_network_connect 1   # WAJIB untuk CentOS/SELinux!
# 3. sudo nginx -t
# 4. sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name 192.168.40.193 iot-humidity.qdms.web.id localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy ke Backend Express (Port 8091)
    # Digunakan oleh Frontend dan Modul ESP8266 IoT (http://192.168.40.193/api/data)
    # --------------------------------------------------------------------------
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Direct backend route endpoints
    location ~ ^/(notifications|auth|data|devices|users|locations|health|admin|test-db)(/.*)?$ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # --------------------------------------------------------------------------
    # 2. Static Assets Caching (Next.js Static Files)
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------------------------
    # 3. Frontend Web App (Next.js SSR via Port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

