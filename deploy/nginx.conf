
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  localhost 192.168.43.175;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen       443 ssl;
        server_name  localhost 192.168.43.175;

        # SSL Configuration
        # Update these paths to where you place your certificates
        ssl_certificate      C:/IoT/certificates/server.crt; 
        ssl_certificate_key  C:/IoT/certificates/server.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";

        # FRONTEND (Next.js)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # BACKEND (Express API)
        # Assuming backend runs on HTTP port 8091 locally
        location /api/ {
            # Rewrite /api/foo to /foo if your backend doesn't expect /api prefix
            # rewrite ^/api/(.*) /$1 break; 
            
            # OR if your backend handles routes starting with /api (unlikely based on code), remove rewrite.
            # Based on inspection, backend routes are like /auth/login.
            # So we usually need to proxy /api/auth/login -> 127.0.0.1:8091/auth/login or similar.
            # Let's use a rewrite to strip /api prefix.
            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # DATA ENDPOINT (for direct access if needed, or mapped via /api)
        # Your backend has /data routes. They will be accessible via /api/data
    }
}
