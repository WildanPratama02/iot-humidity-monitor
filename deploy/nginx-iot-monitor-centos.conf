# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=iot_limit:10m rate=10r/s;

# Upstream servers
upstream backend_api {
    server 127.0.0.1:8090;
    keepalive 32;
}

upstream frontend_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name iot-humidity.qdms.web.id;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ESP8266 endpoint (HTTP) - Still allowed for devices that don't support SSL
    location /api/data {
        limit_req zone=iot_limit burst=20 nodelay;
        proxy_pass http://backend_api/data;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://iot-humidity.qdms.web.id$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name iot-humidity.qdms.web.id;

    # SSL Configuration (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/iot-humidity.qdms.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-humidity.qdms.web.id/privkey.pem;
    
    # Uncomment below and comment above for initial setup without SSL
    # ssl_certificate /etc/nginx/ssl/server.crt;
    # ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;

    # Logging
    access_log /var/log/nginx/iot-monitor.access.log;
    error_log /var/log/nginx/iot-monitor.error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API → Backend
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend → Next.js
    location / {
        proxy_pass http://frontend_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Buffer settings for Next.js
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
    }
}
